<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4dfe6" />
  <meta name="description" content="Pufftop Park — a tiny interactive amusement park floating above the clouds, with a day and night mode, fireflies and bloom." />
  <title>Pufftop Park · Above the Clouds</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffb6c9'/%3E%3Cpath d='M17 41c-4 0-7-3-7-7s3-7 7-7c1-6 6-10 12-10 6 0 11 4 12 10 4 0 7 3 7 7s-3 7-7 7H17z' fill='%23fff7e9'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-mode="day">

  <div id="scene" aria-hidden="true"></div>

  <div id="vignette" aria-hidden="true"></div>

  <div id="hud">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" role="presentation">
          <path d="M12.4 32.8c-3.8 0-6.9-3-6.9-6.8 0-3.4 2.5-6.2 5.8-6.7.8-5.6 5.6-9.9 11.4-9.9 5.7 0 10.4 4.2 11.3 9.7 3.8.1 6.8 3.2 6.8 7 0 3.8-3.1 6.8-6.9 6.8H12.4z" />
          <circle cx="24" cy="39.5" r="2.1" class="dot" />
        </svg>
      </div>
      <div class="brand-copy">
        <p class="eyebrow">A little world above the clouds</p>
        <h1>Pufftop Park</h1>
      </div>
    </header>

    <div class="mode-stack">
      <div class="phase-chip">
        <span class="phase-dot" aria-hidden="true"></span>
        <span>PHASE 03</span>
        <span class="chip-divider" aria-hidden="true"></span>
        <span class="phase-day" id="mode-word">DAYLIGHT</span>
      </div>

      <div class="mode-toggle" id="mode-toggle" role="group" aria-label="Lighting mode">
        <span class="mode-thumb" aria-hidden="true"></span>
        <button class="mode-choice mode-day" type="button" data-mode="day" aria-label="Day lighting" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.4v2.4M12 19.2v2.4M2.4 12h2.4M19.2 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M18.8 5.2l-1.7 1.7M6.9 17.1l-1.7 1.7" />
          </svg>
          <span class="choice-label">Day</span>
        </button>
        <button class="mode-choice mode-dusk" type="button" data-mode="dusk" aria-label="Sunset lighting" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.2 17.2h17.6M6.4 17.2a5.6 5.6 0 0 1 11.2 0M12 4.2v2.2M4.7 7.4l1.6 1.6M19.3 7.4l-1.6 1.6M2.8 12.4h2.1M19.1 12.4h2.1" />
          </svg>
          <span class="choice-label">Dusk</span>
        </button>
        <button class="mode-choice mode-night" type="button" data-mode="night" aria-label="Night lighting" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.7 15.2A8.2 8.2 0 0 1 8.8 4.3a8.5 8.5 0 1 0 10.9 10.9z" />
          </svg>
          <span class="choice-label">Night</span>
        </button>
      </div>
      <p class="mode-hint" id="mode-hint">Day · Dusk · Night</p>
    </div>

    <div class="quote" aria-hidden="true">
      <span class="quote-line"></span>
      <p>Open from sunrise<br />until the balloons come home.</p>
    </div>

    <div class="hint" role="note">
      <svg class="mouse-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6.2" y="2.7" width="11.6" height="18.6" rx="5.8" />
        <line x1="12" y1="6.5" x2="12" y2="9.3" />
      </svg>
      <span class="hint-main">Drag to orbit</span>
      <span class="hint-sep">·</span>
      <span class="hint-sub">Scroll to zoom</span>
      <span class="hint-sep hint-extra">·</span>
      <span class="hint-extra">Double-click to reset</span>
      <span class="hint-sep hint-mobile-sep">·</span>
      <span class="hint-mobile">Pinch to zoom</span>
    </div>

    <div class="corner-note">FERRIS · CAROUSEL · COMET COASTER</div>
  </div>

  <div id="loading">
    <div class="loader-inner">
      <div class="loader-cloud" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p class="loader-kicker">PUFFTOP PARK</p>
      <p class="loader-line">Hoisting the bunting…</p>
    </div>
  </div>

  <noscript>
    <div class="no-script">Pufftop Park needs JavaScript and WebGL to float.</div>
  </noscript>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/vendor/addons/EffectComposer.js"></script>
  <script src="js/vendor/addons/RenderPass.js"></script>
  <script src="js/vendor/addons/ShaderPass.js"></script>
  <script src="js/vendor/addons/UnrealBloomPass.js"></script>
  <script src="js/core.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/world.js"></script>
  <script src="js/rides.js"></script>
  <script src="js/park.js"></script>
  <script src="js/postfx.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/fireworks.js"></script>
  <script src="js/atmosphere.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
